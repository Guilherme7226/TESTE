<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Vendas - Pães | COSTALOG</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#151515;--muted:#666;--red:#d71920;--green:#2e7d32;--green2:#1b5e20}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:24px}
.container{width:100%;max-width:430px;margin:auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}.back{color:var(--red);text-decoration:none;font-weight:700}.card{background:var(--card);padding:25px;border-radius:18px;box-shadow:0 8px 30px #00000012}.brand{font-size:13px;font-weight:800;letter-spacing:1px;color:var(--red);margin-bottom:6px}.brand span{color:#777}.title{margin:0 0 22px;font-size:25px;text-align:center}label{display:block;margin:0 0 7px;font-weight:700;font-size:14px}.group{margin-bottom:17px}input{width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;font-size:16px;outline:none;background:#fff}input:focus{border-color:var(--green)}#cliente{text-transform:uppercase}.total{background:#e8f5e9;color:var(--green);padding:14px;border-radius:9px;text-align:center;font-size:19px;font-weight:800;margin:4px 0 18px}button{width:100%;border:0;background:var(--green);color:#fff;padding:14px;border-radius:9px;font-size:16px;font-weight:800;cursor:pointer}button:hover{background:var(--green2)}button:disabled{opacity:.65;cursor:wait}#mensagem{text-align:center;min-height:22px;margin-top:14px;font-size:14px;font-weight:600}.info{margin-top:16px;padding:12px;border-radius:9px;background:#f1f1f1;color:var(--muted);font-size:12px;line-height:1.5}@media(max-width:480px){body{padding:14px}.card{padding:21px}}
</style>
</head>
<body>
<div class="container">
<div class="top"><a class="back" href="./">← Voltar</a></div>
<div class="card">
<div class="brand">COSTALOG <span>• CONTROLE INTERNO</span></div>
<h1 class="title">🍞 Venda de Pães</h1>
<div class="group"><label for="cliente">Cliente</label><input type="text" id="cliente" placeholder="Ex: VICTOR HUGO" autocomplete="off"></div>
<div class="group"><label for="qtd">Quantidade</label><input type="number" id="qtd" value="1" min="1" step="1" oninput="calcularTotal()"></div>
<div class="total">Total: R$ <span id="valorTotal">8,00</span></div>
<button id="btn" onclick="enviarVenda()">Registrar Venda</button>
<div id="mensagem"></div>
<div class="info">Valor unitário: <strong>R$ 8,00</strong>. Os dados serão enviados para o Google Apps Script configurado no código.</div>
</div>
</div>
<script>
const URL_WEB_APP = "https://script.google.com/macros/s/AKfycby7jjjQ1DOlio9ZUMkbqk4_9_3Tltw_kjVEX-CTBKeUCUy8IuQDiRkCrRlh5bngpm04/exec";
const VALOR_UNITARIO = 8.00;
function calcularTotal(){const qtd=Math.max(0,Number(document.getElementById('qtd').value)||0);document.getElementById('valorTotal').textContent=(qtd*VALOR_UNITARIO).toFixed(2).replace('.',',');}
async function enviarVenda(){
 const cliente=document.getElementById('cliente').value.trim().toUpperCase(),qtd=Number(document.getElementById('qtd').value),msg=document.getElementById('mensagem'),btn=document.getElementById('btn');
 if(!cliente){msg.style.color='#c62828';msg.textContent='Informe o nome do cliente.';return}
 if(!Number.isInteger(qtd)||qtd<1){msg.style.color='#c62828';msg.textContent='Informe uma quantidade válida.';return}
 btn.disabled=true;msg.style.color='#666';msg.textContent='Registrando...';
 const url=URL_WEB_APP+'?acao=venda&cliente='+encodeURIComponent(cliente)+'&qtd='+encodeURIComponent(qtd);
 try{const response=await fetch(url);if(!response.ok)throw new Error('HTTP '+response.status);await response.text();msg.style.color='#2e7d32';msg.textContent='✅ Venda registrada com sucesso!';document.getElementById('cliente').value='';document.getElementById('qtd').value='1';calcularTotal();}
 catch(error){msg.style.color='#c62828';msg.textContent='Erro ao registrar. Verifique o Google Apps Script.';}
 finally{btn.disabled=false}
}
calcularTotal();
</script>
</body>
</html>
