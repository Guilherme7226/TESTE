<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compilador de PDF | COSTALOG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
:root{--bg:#f4f4f9;--card:#fff;--text:#333;--muted:#666;--line:#ddd;--blue:#007bff;--blue2:#0056b3;--surface:#fafafa}
html.dark{--bg:#080808;--card:#121212;--text:#fff;--muted:#aaa;--line:#2b2b2b;--surface:#101010}
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px;transition:.2s}
.container{max-width:900px;margin:0 auto;background:var(--card);padding:20px;border-radius:8px;box-shadow:0 4px 8px #0000001a}
.topnav{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.topnav a,.topnav button{background:var(--card);color:var(--text);border:1px solid var(--line);padding:9px 12px;border-radius:5px;text-decoration:none;font-weight:700;cursor:pointer}
h1{color:var(--text);text-align:center}
.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
button,label.btn-upload{background:var(--blue);color:#fff;border:none;padding:10px 15px;border-radius:5px;cursor:pointer;font-size:14px;transition:background .2s}
button:hover,label.btn-upload:hover{background:var(--blue2)}
input[type=file]{display:none}
#pagesContainer{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:15px;min-height:250px;border:2px dashed #ccc;border-radius:8px;padding:15px;background:var(--surface)}
.page-card{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;align-items:center;cursor:grab;position:relative}
.page-card.selected{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--card))}
.page-card img{max-width:100%;height:140px;object-fit:contain;background:#eee;border-radius:4px;margin-bottom:5px}
.page-info{font-size:12px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:#999;padding:50px}
@media(max-width:650px){body{padding:10px}.container{padding:14px}.topnav{justify-content:center}}
</style>
</head>
<body>
<div class="container">
  <div class="topnav">
    <a href="./">🏠 Início</a>
    <a href="./separador.html">✂️ Separador</a>
    <a href="./container.html">🚢 Container</a>
    <button id="theme">🌙</button>
  </div>

  <h1>Compilador de PDF Online</h1>

  <div class="toolbar">
    <label class="btn-upload">+ Adicionar Ficheiros
      <input type="file" id="fileInput" multiple accept="application/pdf">
    </label>
    <button onclick="girarSelecionadas(-90)">🔄 Girar Esquerda</button>
    <button onclick="girarSelecionadas(90)">🔄 Girar Direita</button>
    <button onclick="excluirSelecionadas()" style="background-color:#dc3545;">🗑️ Excluir Selecionadas</button>
    <button onclick="gerarPDFFinal()" style="background-color:#28a745;">📥 Juntar e Baixar PDF</button>
  </div>

  <div id="pagesContainer">
    <div id="emptyMessage" class="empty">Nenhum documento adicionado. Clique em "+ Adicionar Ficheiros" para começar.</div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
let paginasGlobais=[];

document.getElementById('fileInput').addEventListener('change',async function(e){
  await adicionarArquivos(e.target.files);
  this.value='';
});

async function adicionarArquivos(files){
  if(!files.length)return;
  document.getElementById('emptyMessage')?.remove();
  for(const file of files){
    try{
      const arrayBuffer=await file.arrayBuffer();
      const pdfDoc=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
      for(let i=1;i<=pdfDoc.numPages;i++){
        const page=await pdfDoc.getPage(i);
        const viewport=page.getViewport({scale:.3});
        const canvas=document.createElement('canvas');
        const context=canvas.getContext('2d');
        canvas.height=viewport.height;
        canvas.width=viewport.width;
        await page.render({canvasContext:context,viewport}).promise;
        const paginaObj={
          id:'page_'+Math.random().toString(36).substr(2,9),
          originalFile:file.name,
          arrayBuffer,
          pageNumber:i,
          rotation:0,
          dataUrl:canvas.toDataURL(),
          selected:false
        };
        paginasGlobais.push(paginaObj);
        renderizarMiniatura(paginaObj);
      }
    }catch(err){
      console.error('Erro ao processar PDF:',err);
      alert('Erro ao ler o ficheiro: '+file.name);
    }
  }
}

function renderizarMiniatura(pagObj){
  const container=document.getElementById('pagesContainer');
  const card=document.createElement('div');
  card.className='page-card '+(pagObj.selected?'selected':'');
  card.setAttribute('data-id',pagObj.id);
  card.onclick=()=>{
    pagObj.selected=!pagObj.selected;
    card.className='page-card '+(pagObj.selected?'selected':'');
  };
  const img=document.createElement('img');
  img.src=pagObj.dataUrl;
  img.style.transform='rotate('+pagObj.rotation+'deg)';
  const info=document.createElement('div');
  info.className='page-info';
  info.innerText='Pág. '+pagObj.pageNumber;
  card.appendChild(img);
  card.appendChild(info);
  container.appendChild(card);
}

new Sortable(document.getElementById('pagesContainer'),{
  animation:150,
  filter:'#emptyMessage',
  onUpdate:function(){
    const novaOrdem=[];
    document.querySelectorAll('.page-card').forEach(card=>{
      const encontrada=paginasGlobais.find(p=>p.id===card.getAttribute('data-id'));
      if(encontrada)novaOrdem.push(encontrada);
    });
    paginasGlobais=novaOrdem;
  }
});

function girarSelecionadas(graus){
  paginasGlobais.forEach(p=>{
    if(p.selected)p.rotation=(p.rotation+graus+360)%360;
  });
  atualizarGrelha();
}

function excluirSelecionadas(){
  paginasGlobais=paginasGlobais.filter(p=>!p.selected);
  atualizarGrelha();
}

function atualizarGrelha(){
  const container=document.getElementById('pagesContainer');
  container.innerHTML='';
  if(!paginasGlobais.length){
    container.innerHTML='<div id="emptyMessage" class="empty">Nenhum documento adicionado. Clique em "+ Adicionar Ficheiros" para começar.</div>';
    return;
  }
  paginasGlobais.forEach(p=>renderizarMiniatura(p));
}

async function gerarPDFFinal(){
  if(!paginasGlobais.length){
    alert('Adicione pelo menos uma página para exportar.');
    return;
  }
  try{
    const pdfDocFinal=await PDFLib.PDFDocument.create();
    const cacheBuffers={};
    for(const p of paginasGlobais){
      if(!cacheBuffers[p.originalFile])cacheBuffers[p.originalFile]=await PDFLib.PDFDocument.load(p.arrayBuffer);
      const pdfOrig=cacheBuffers[p.originalFile];
      const [paginaCopiada]=await pdfDocFinal.copyPages(pdfOrig,[p.pageNumber-1]);
      if(p.rotation!==0){
        const rotacaoAtual=paginaCopiada.getRotation().angle;
        paginaCopiada.setRotation(PDFLib.degrees(rotacaoAtual+p.rotation));
      }
      pdfDocFinal.addPage(paginaCopiada);
    }
    const pdfBytes=await pdfDocFinal.save();
    const blob=new Blob([pdfBytes],{type:'application/pdf'});
    const link=document.createElement('a');
    link.href=URL.createObjectURL(blob);
    link.download='documento-unificado.pdf';
    link.click();
    setTimeout(()=>URL.revokeObjectURL(link.href),1000);
  }catch(err){
    console.error('Erro ao gerar PDF:',err);
    alert('Ocorreu um erro ao gerar o PDF final.');
  }
}

const pagesContainer=document.getElementById('pagesContainer');
document.addEventListener('dragover',e=>{
  if(e.dataTransfer?.types?.includes('Files')){
    e.preventDefault();
    pagesContainer.style.borderColor='#007bff';
  }
});
document.addEventListener('dragleave',e=>{
  if(e.relatedTarget===null)pagesContainer.style.borderColor='#ccc';
});
document.addEventListener('drop',async e=>{
  if(e.dataTransfer?.types?.includes('Files')){
    e.preventDefault();
    pagesContainer.style.borderColor='#ccc';
    await adicionarArquivos(e.dataTransfer.files);
  }
});

(function(){
  const key='costalog-theme';
  const root=document.documentElement;
  const button=document.getElementById('theme');
  const apply=mode=>{
    const dark=mode==='dark';
    root.classList.toggle('dark',dark);
    localStorage.setItem(key,dark?'dark':'light');
    if(button)button.textContent=dark?'☀️':'🌙';
  };
  apply(localStorage.getItem(key)==='dark'?'dark':'light');
  if(button)button.addEventListener('click',()=>apply(root.classList.contains('dark')?'light':'dark'));
})();
</script>
</body>
</html>
