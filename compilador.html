<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compilador PDF | COSTALOG</title><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#102a43;--muted:#6b7c8f;--line:#dce5ee;--blue:#0b4f8a;--blue2:#0877b9;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}.wrap{width:min(980px,92%);margin:auto}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{color:var(--text);text-decoration:none;font-weight:900}.nav a,.nav button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:10px;text-decoration:none;font-weight:750;cursor:pointer}.hero{text-align:center;padding:28px 0}.hero h1{font-size:clamp(36px,6vw,54px);letter-spacing:-2px;margin:10px 0}.hero p{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 18px 50px #102a4312}.drop{border:2px dashed #9ebbd1;border-radius:18px;padding:42px 20px;text-align:center;background:#f8fbfd}.drop.over{border-color:var(--blue);background:#e6f2fa}.big{font-size:42px}.drop p{color:var(--muted);margin:5px 0 18px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}.secondary{background:#e7f1f8;color:var(--blue)}.danger{background:#fee4e2;color:var(--danger)}.toolbar,.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.list{display:flex;flex-direction:column;gap:9px}.empty{text-align:center;color:var(--muted);padding:28px;border:1px solid var(--line);border-radius:13px}.item{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--card)}.item.dragging{opacity:.4}.item.target{border:2px dashed var(--blue)}.handle{font-size:20px;color:#9aa8b5;cursor:grab}.pdf{width:40px;height:40px;border-radius:10px;background:#fee4e2;color:var(--danger);display:grid;place-items:center;font-size:11px;font-weight:900}.info{flex:1;min-width:0}.name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.size{font-size:12px;color:var(--muted);margin-top:3px}.progress{display:none;height:5px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress div{height:100%;background:var(--blue);width:0}.note{text-align:center;color:var(--muted);font-size:12px;padding:16px 0 35px}.modal{position:fixed;inset:0;background:#07131fee;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.open{display:flex}.box{width:min(1000px,96vw);height:min(92vh,900px);background:var(--card);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.mhead{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.mbody{flex:1;overflow:auto;background:#e7ebef;display:flex;align-items:center;justify-content:center;padding:18px}.mbody canvas{max-width:100%;box-shadow:0 5px 20px #0003}.dark{--bg:#07131f;--card:#0e2233;--text:#edf5fb;--muted:#a8b9c8;--line:#25445a}.dark .drop{background:#0b1c2a}.dark .secondary{background:#143b54;color:#cbe8fa}.dark .mbody{background:#07131f}@media(max-width:650px){.toolbar,.footer{align-items:stretch;flex-direction:column}.actions{width:100%}.actions>*{flex:1}}
</style></head><body><header class="wrap nav"><a href="./" class="brand">← COSTALOG PDF</a><div><a href="./separador.html">✂️ Separador</a><button id="theme">🌙</button></div></header><main class="wrap"><section class="hero"><h1>Compilador de PDF</h1><p>Adicione, arraste para reordenar e transforme vários PDFs em um só.</p></section><section class="card"><div id="drop" class="drop"><div class="big">📄</div><h2>Arraste os PDFs aqui</h2><p>Ou escolha vários arquivos.</p><label class="btn primary" for="pick">Adicionar PDFs</label><input id="pick" type="file" accept=".pdf,application/pdf" multiple hidden></div><div class="toolbar"><strong>Arquivos <span id="count">(0)</span></strong><div class="actions"><label class="btn secondary" for="more">＋ Adicionar mais</label><input id="more" type="file" accept=".pdf,application/pdf" multiple hidden><button class="btn danger" id="clear">Limpar tudo</button></div></div><div id="list" class="list"><div class="empty">Nenhum PDF adicionado.</div></div><div class="progress" id="progress"><div id="bar"></div></div><div class="footer"><span id="status" style="color:var(--muted);font-size:13px">Processamento local.</span><button class="btn primary" id="merge" disabled>📎 Compilar PDF</button></div></section><div class="note">Seus arquivos não são enviados para um servidor.</div></main><div id="modal" class="modal"><div class="box"><div class="mhead"><strong id="title">PDF</strong><div><button class="btn" id="prev">←</button><span id="pg">1 / 1</span><button class="btn" id="next">→</button><button class="btn" id="close">Fechar</button></div></div><div class="mbody"><canvas id="canvas"></canvas></div></div></div><script>
const {PDFDocument}=PDFLib;let files=[],doc=null,page=0;const $=id=>document.getElementById(id);const s=localStorage.getItem('costalog-theme');if(s==='dark')document.documentElement.classList.add('dark');$('theme').textContent=s==='dark'?'☀️':'🌙';$('theme').onclick=()=>{const d=document.documentElement.classList.toggle('dark');localStorage.setItem('costalog-theme',d?'dark':'light');$('theme').textContent=d?'☀️':'🌙'};function fmt(n){return n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function add(fs){const a=[...fs].filter(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));files.push(...a);render()}function move(i,d){const j=i+d;if(j<0||j>=files.length)return;[files[i],files[j]]=[files[j],files[i]];render()}function render(){const l=$('list');$('count').textContent='('+files.length+')';$('merge').disabled=!files.length;if(!files.length){l.innerHTML='<div class="empty">Nenhum PDF adicionado.</div>';return}l.innerHTML='';files.forEach((f,i)=>{const e=document.createElement('div');e.className='item';e.draggable=true;e.dataset.i=i;e.innerHTML='<span class="handle">☷</span><span class="pdf">PDF</span><div class="info"><div class="name">'+esc(f.name)+'</div><div class="size">'+fmt(f.size)+'</div></div><div><button class="btn" data-v="'+i+'">👁</button> <button class="btn" data-u="'+i+'">↑</button> <button class="btn" data-d="'+i+'">↓</button> <button class="btn danger" data-x="'+i+'">×</button></div>';l.appendChild(e)});document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.x,1);render()});document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>move(+b.dataset.u,-1));document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(+b.dataset.d,1));document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>preview(+b.dataset.v));document.querySelectorAll('.item').forEach(e=>{e.ondragstart=x=>{x.dataTransfer.setData('text/plain',e.dataset.i);e.classList.add('dragging')};e.ondragend=()=>document.querySelectorAll('.item').forEach(q=>q.classList.remove('dragging','target'));e.ondragover=x=>{x.preventDefault();if(x.dataTransfer.types.includes('text/plain'))e.classList.add('target')};e.ondragleave=()=>e.classList.remove('target');e.ondrop=x=>{x.preventDefault();e.classList.remove('target');const a=+x.dataTransfer.getData('text/plain'),b=+e.dataset.i;if(a===b)return;const [m]=files.splice(a,1);files.splice(a<b?b-1:b,0,m);render()}})}$('pick').onchange=e=>{add(e.target.files);e.target.value=''};$('more').onchange=e=>{add(e.target.files);e.target.value=''};$('clear').onclick=()=>{files=[];render()};const drop=$('drop');['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over')}));drop.ondrop=e=>{if(e.dataTransfer.types.includes('text/plain'))return;add(e.dataTransfer.files)};$('merge').onclick=async()=>{if(!files.length)return;$('merge').disabled=true;$('progress').style.display='block';try{const out=await PDFDocument.create();for(let i=0;i<files.length;i++){const p=await PDFDocument.load(await files[i].arrayBuffer());(await out.copyPages(p,p.getPageIndices())).forEach(x=>out.addPage(x));$('bar').style.width=((i+1)/files.length*100)+'%'}const u=URL.createObjectURL(new Blob([await out.save()],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download='COSTALOG-PDF-compilado.pdf';a.click();URL.revokeObjectURL(u);$('status').textContent='PDF compilado com sucesso.'}catch(e){$('status').textContent='Erro ao compilar.'}finally{$('merge').disabled=false;setTimeout(()=>$('progress').style.display='none',700)}};async function preview(i){const pjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');pjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';doc=await pjs.getDocument({data:await files[i].arrayBuffer()}).promise;page=0;$('title').textContent=files[i].name;await draw();$('modal').classList.add('open')}async function draw(){const p=await doc.getPage(page+1),v=p.getViewport({scale:1}),sc=Math.min(900/v.width,760/v.height),vp=p.getViewport({scale:sc}),c=$('canvas');c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;$('pg').textContent=(page+1)+' / '+doc.numPages}$('prev').onclick=async()=>{if(page){page--;await draw()}};$('next').onclick=async()=>{if(doc&&page<doc.numPages-1){page++;await draw()}};$('close').onclick=()=>$('modal').classList.remove('open');document.onkeydown=e=>{if(e.key==='Escape')$('modal').classList.remove('open');if($('modal').classList.contains('open')&&e.key==='ArrowLeft')$('prev').click();if($('modal').classList.contains('open')&&e.key==='ArrowRight')$('next').click()};render();
</script></body></html>
