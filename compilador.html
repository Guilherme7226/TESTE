</style><style id="costalog-theme-final">

</style></head><body><header class="wrap nav"><a href="./" class="brand">← COSTALOG PDF</a><div><a href="./separador.html">✂️ Separador</a><button id="theme">🌙</button></div></header><main class="wrap"><section class="hero"><h1>Compilador de PDF</h1><p>Adicione, arraste para reordenar e transforme vários PDFs em um só.</p></section><section class="card"><div id="drop" class="drop"><div class="big">📄</div><h2>Arraste os PDFs aqui</h2><p>Ou escolha vários arquivos.</p><label class="btn primary" for="pick">Adicionar PDFs</label><input id="pick" type="file" accept=".pdf,application/pdf" multiple hidden></div><div class="toolbar"><strong>Arquivos <span id="count">(0)</span></strong><div class="actions"><label class="btn secondary" for="more">＋ Adicionar mais</label><input id="more" type="file" accept=".pdf,application/pdf" multiple hidden><button class="btn danger" id="clear">Limpar tudo</button></div></div><div id="list" class="list"><div class="empty">Nenhum PDF adicionado.</div></div><div class="progress" id="progress"><div id="bar"></div></div><div class="footer"><span id="status" style="color:#aaa;font-size:13px">Processamento local.</span><button class="btn primary" id="merge" disabled>📎 Compilar PDF</button></div></section><div class="note">Seus arquivos não são enviados para um servidor.</div></main><div id="modal" class="modal"><div class="box"><div class="mhead"><strong id="title">PDF</strong><div><button class="btn" id="prev">←</button><span id="pg">1 / 1</span><button class="btn" id="next">→</button><button class="btn" id="close">Fechar</button></div></div><div class="mbody"><div id="pages" class="pages"></div></div></div></div><script>
const {PDFDocument}=PDFLib;let files=[],doc=null,page=0;const $=id=>document.getElementById(id);const s=localStorage.getItem('costalog-theme');document.documentElement.classList.add('dark');$('theme').textContent=s==='dark'?'☀️':'🌙';$('theme').onclick=()=>{const d=document.documentElement.classList.toggle('dark');localStorage.setItem('costalog-theme','dark');$('theme').textContent=d?'☀️':'🌙'};function fmt(n){return n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function add(fs){const a=[...fs].filter(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));files.push(...a);render()}function move(i,d){const j=i+d;if(j<0||j>=files.length)return;[files[i],files[j]]=[files[j],files[i]];render()}function render(){const l=$('list');$('count').textContent='('+files.length+')';$('merge').disabled=!files.length;if(!files.length){l.innerHTML='<div class="empty">Nenhum PDF adicionado.</div>';return}l.innerHTML='';files.forEach((f,i)=>{const e=document.createElement('div');e.className='item';e.draggable=true;e.dataset.i=i;e.innerHTML='<span class="handle">☷</span><span class="pdf">PDF</span><div class="info"><div class="name">'+esc(f.name)+'</div><div class="size">'+fmt(f.size)+'</div></div><div><button class="btn" data-v="'+i+'">👁</button> <button class="btn" data-u="'+i+'">↑</button> <button class="btn" data-d="'+i+'">↓</button> <button class="btn danger" data-x="'+i+'">×</button></div>';l.appendChild(e)});document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.x,1);render()});document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>move(+b.dataset.u,-1));document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(+b.dataset.d,1));document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>preview(+b.dataset.v));document.querySelectorAll('.item').forEach(e=>{e.ondragstart=x=>{x.dataTransfer.setData('text/plain',e.dataset.i);e.classList.add('dragging')};e.ondragend=()=>document.querySelectorAll('.item').forEach(q=>q.classList.remove('dragging','target'));e.ondragover=x=>{x.preventDefault();if(x.dataTransfer.types.includes('text/plain'))e.classList.add('target')};e.ondragleave=()=>e.classList.remove('target');e.ondrop=x=>{x.preventDefault();e.classList.remove('target');const a=+x.dataTransfer.getData('text/plain'),b=+e.dataset.i;if(a===b)return;const [m]=files.splice(a,1);files.splice(a<b?b-1:b,0,m);render()}})}$('pick').onchange=e=>{add(e.target.files);e.target.value=''};$('more').onchange=e=>{add(e.target.files);e.target.value=''};$('clear').onclick=()=>{files=[];render()};const drop=$('drop');['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over')}));drop.ondrop=e=>{if(e.dataTransfer.types.includes('text/plain'))return;add(e.dataTransfer.files)};$('merge').onclick=async()=>{if(!files.length)return;$('merge').disabled=true;$('progress').style.display='block';try{const out=await PDFDocument.create();for(let i=0;i<files.length;i++){const p=await PDFDocument.load(await files[i].arrayBuffer());(await out.copyPages(p,p.getPageIndices())).forEach(x=>out.addPage(x));$('bar').style.width=((i+1)/files.length*100)+'%'}const u=URL.createObjectURL(new Blob([await out.save()],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download='COSTALOG-PDF-compilado.pdf';a.click();URL.revokeObjectURL(u);$('status').textContent='PDF compilado com sucesso.'}catch(e){$('status').textContent='Erro ao compilar.'}finally{$('merge').disabled=false;setTimeout(()=>$('progress').style.display='none',700)}};async function preview(i){const pjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');pjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';doc=await pjs.getDocument({data:await files[i].arrayBuffer()}).promise;$('title').textContent=files[i].name;$('pages').innerHTML='';for(let n=1;n<=doc.numPages;n++){const p=await doc.getPage(n),v=p.getViewport({scale:1}),sc=Math.min(900/v.width,760/v.height),vp=p.getViewport({scale:sc}),wrap=document.createElement('div');wrap.className='pdfpage';const canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;const z=document.createElement('button');z.className='zoom';z.title='Ampliar esta página';z.textContent='🔍';z.onclick=()=>zoomPage(wrap);wrap.appendChild(canvas);wrap.appendChild(z);$('pages').appendChild(wrap);await p.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise}$('modal').classList.add('open')}function zoomPage(wrap){document.querySelectorAll('.zoomed').forEach(x=>x.classList.remove('zoomed'));document.querySelectorAll('.zoom-close').forEach(x=>x.remove());wrap.classList.add('zoomed');const close=document.createElement('button');close.className='zoom-close';close.textContent='×';close.onclick=()=>{wrap.classList.remove('zoomed');close.remove()};document.body.appendChild(close)}$('prev').style.display='none';$('next').style.display='none';$('pg').style.display='none';$('close').onclick=()=>$('modal').classList.remove('open');document.onkeydown=e=>{if(e.key==='Escape'){document.querySelectorAll('.zoomed').forEach(x=>x.classList.remove('zoomed'));document.querySelectorAll('.zoom-close').forEach(x=>x.remove());$('modal').classList.remove('open')}};render();
</script><script>
(function(){
  const key='costalog-theme';
  const root=document.documentElement;
  const button=document.getElementById('theme');
  const apply=mode=>{
    const dark=mode==='dark';
    root.classList.toggle('dark',dark);
    localStorage.setItem(key,dark?'dark':'light');
    if(button) button.textContent=dark?'☀️':'🌙';
  };
  apply(localStorage.getItem(key)==='dark'?'dark':'light');
  if(button) button.addEventListener('click',()=>apply(root.classList.contains('dark')?'light':'dark'));
})();
</script></body></html>
