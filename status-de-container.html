<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Status de Container | COSTALOG</title>
<style>
:root{--bg:#fff;--card:#fff;--surface:#f5f5f5;--text:#111;--muted:#666;--line:#ddd;--red:#d71920;--blue:#0d6efd;--green:#16803c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{width:min(900px,92%);margin:auto}.top{border-bottom:2px solid var(--red);padding:18px 0}.brand{font-weight:900;font-size:21px}.brand span{color:var(--red)}
main{padding:38px 0 70px}h1{font-size:clamp(32px,6vw,52px);margin:0 0 8px}h1 span{color:var(--red)}.intro{color:var(--muted);line-height:1.55}
.card{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 10px 30px #00000012}
.filters{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px;color:var(--muted)}input,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);outline:none;font-size:16px}input:focus,textarea:focus{border-color:var(--red)}textarea{min-height:230px;resize:vertical;font:600 16px monospace}
.buttons{display:flex;gap:10px;margin-top:12px}.btn{border:0;border-radius:9px;padding:13px 18px;font-weight:850;cursor:pointer}.primary{background:var(--red);color:#fff}.blue{background:var(--blue);color:#fff}.gray{background:var(--surface);color:var(--text);border:1px solid var(--line)}.hidden{display:none}
#resultado{margin-top:20px}.table{border:1px solid var(--line);border-radius:10px;overflow:hidden}.row{display:grid;grid-template-columns:1fr 1.5fr;gap:15px;padding:12px 14px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.head{font-weight:900;background:var(--surface);font-size:12px}.status{font-weight:750}.notfound{color:#a00}.empty{color:#8a5a00}.whatsapp{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);white-space:pre-wrap;line-height:1.55;font-family:Arial,sans-serif}.msg{padding:12px;border-radius:9px;background:var(--surface);color:var(--muted)}.count{margin-top:9px;font-size:12px;color:var(--muted)}
@media(max-width:650px){.filters{grid-template-columns:1fr}.buttons{flex-direction:column}.row{grid-template-columns:1fr}.head{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand"><span>C</span> COSTALOG — STATUS DE CONTAINER</div></div></header>
<main><div class="wrap">
<h1>Status de <span>Container</span></h1>
<p class="intro">Informe a data para filtrar rapidamente e cole quantos containers quiser. O sistema procura na coluna <b>T</b> e retorna o status da coluna <b>AY</b> da aba <b>Mapa 1</b>.</p>
<section class="card">
<div class="filters">
<div class="field"><label for="data">DATA (COLUNA A)</label><input id="data" type="date"></div>
<div class="field"><label for="entrada">CONTAINERS</label><input id="entradaRapida" placeholder="Cole vários containers separados por espaço, vírgula ou quebra de linha"></div>
</div>
<textarea id="entrada" placeholder="HAMU2635788
TCNU6894772
MRKU6243716
KKTU8188495"></textarea>
<div class="buttons"><button class="btn primary" onclick="consultar()">🔎 CONSULTAR</button><button id="copiar" class="btn blue hidden" onclick="copiar()">📋 COPIAR PARA WHATSAPP</button><button class="btn gray" onclick="limpar()">LIMPAR</button></div>
<div id="resultado"></div>
</section></div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbxyAgJZpSXA-tZ2u5jmni49jhcAJ2T062byfXGPmLVMK8j7tRN5cfsPR6WYImFTZ3Xm/exec';
let textoWhatsapp='';
const entrada=document.getElementById('entrada');
const entradaRapida=document.getElementById('entradaRapida');
entradaRapida.addEventListener('input',()=>{entrada.value=entradaRapida.value.replace(/[,;]+/g,'\n').replace(/\s+/g,'\n');});
entrada.addEventListener('input',()=>{entradaRapida.value='';});
function consultar(){
 const lista=entrada.value.split(/[\s,;]+/).map(x=>x.trim().toUpperCase()).filter(Boolean);
 const data=document.getElementById('data').value;
 if(!lista.length){alert('Digite pelo menos um container.');return;}
 document.getElementById('resultado').innerHTML='<div class="msg">🔎 Consultando '+lista.length+' container(s)...</div>';
 document.getElementById('copiar').classList.add('hidden');
 let url=API+'?containers='+encodeURIComponent(lista.join(','));
 if(data)url+='&data='+encodeURIComponent(data);
 fetch(url).then(r=>r.json()).then(dataRet=>{
  if(!dataRet.success)throw new Error(dataRet.erro||'Erro na consulta');
  textoWhatsapp=dataRet.whatsapp;
  let html='<div class="table"><div class="row head"><div>CONTAINER</div><div>STATUS</div></div>';
  dataRet.resultados.forEach(x=>{const cls=x.status==='NÃO ENCONTRADO'?'notfound':(x.status==='STATUS VAZIO'?'empty':'');html+='<div class="row"><div><b>'+esc(x.container)+'</b></div><div class="status '+cls+'">'+esc(x.status)+'</div></div>';});
  html+='</div><div class="count">'+dataRet.resultados.length+' container(s) consultado(s)'+(data?' • filtro: '+data:'')+'</div><div class="whatsapp">'+esc(textoWhatsapp)+'</div>';
  document.getElementById('resultado').innerHTML=html;
  document.getElementById('copiar').classList.remove('hidden');
 }).catch(e=>{document.getElementById('resultado').innerHTML='<div class="msg">❌ '+esc(e.message)+'</div>';});
}
function copiar(){navigator.clipboard.writeText(textoWhatsapp).then(()=>alert('✅ Copiado para o WhatsApp!')).catch(()=>alert('Selecione o texto e copie manualmente.'));}
function limpar(){entrada.value='';entradaRapida.value='';document.getElementById('data').value='';document.getElementById('resultado').innerHTML='';document.getElementById('copiar').classList.add('hidden');textoWhatsapp='';}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
</script>
</body>
</html>
