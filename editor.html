<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor de PDF | COSTALOG</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>:root{--bg:#f1f1f1;--card:#fff;--text:#111;--muted:#666;--line:#d7d7d7;--red:#d71920}html.dark{--bg:#0a0a0a;--card:#151515;--text:#fff;--muted:#aaa;--line:#333}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.top{height:64px;background:var(--card);border-bottom:2px solid var(--red);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{font-weight:950;text-decoration:none;color:var(--text)}.brand span{color:var(--red)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:7px;padding:9px 13px;font-weight:800;cursor:pointer}.primary{background:var(--red);border-color:var(--red);color:#fff}.workspace{display:grid;grid-template-columns:240px 1fr 250px;height:calc(100vh - 64px)}.side{background:var(--card);border-right:1px solid var(--line);padding:15px;overflow:auto}.right{border-left:1px solid var(--line);border-right:0}.side h3{font-size:13px;margin:4px 0 12px;text-transform:uppercase}.drop{border:2px dashed #aaa;border-radius:12px;padding:25px 10px;text-align:center;cursor:pointer;background:var(--bg)}input[type=file]{display:none}.thumb{margin-top:12px;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;background:var(--bg)}.thumb.active{border-color:var(--red)}.thumb canvas{width:100%;display:block}.thumb small{display:block;padding:5px;text-align:center;color:var(--muted)}.canvas-area{overflow:auto;padding:35px;display:flex;justify-content:center;align-items:flex-start}.page{position:relative;background:#fff;box-shadow:0 10px 35px #0003}.page canvas{display:block}.overlay{position:absolute;min-width:40px;min-height:24px;padding:2px 4px;border:1px dashed transparent;cursor:move;white-space:pre;user-select:none;color:#111}.overlay.selected{border-color:var(--red)}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}.field{width:70px;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--text)}.textedit{width:100%;min-height:100px;resize:vertical;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font:inherit}.help{font-size:12px;color:var(--muted);line-height:1.5}@media(max-width:900px){.workspace{grid-template-columns:1fr}.side{display:none}.right{display:block;position:fixed;bottom:0;left:0;right:0;height:auto;max-height:45vh;z-index:4;box-shadow:0 -5px 20px #0002}.canvas-area{padding:20px 10px 220px}.top{padding:0 10px}}</style></head><body><header class="top"><a class="brand" href="./">COSTALOG <span>PDF</span> • Editor</a><div class="actions"><button class="btn" id="theme">🌙</button><button class="btn" onclick="location.href='./'">← Início</button><button class="btn primary" id="save">💾 Baixar PDF</button></div></header><div class="workspace"><aside class="side"><h3>Documento</h3><label class="drop" id="drop"><strong>📄 Arraste o PDF</strong><small>ou clique para abrir</small><input id="file" type="file" accept="application/pdf"></label><div id="thumbs"></div></aside><main class="canvas-area"><div id="empty" style="padding:80px 20px;text-align:center;color:var(--muted)"><strong style="display:block;color:var(--text);font-size:22px">Editor de PDF</strong>Arraste um PDF para começar.</div><div id="page" class="page" style="display:none"></div></main><aside class="side right"><h3>Editar texto</h3><div class="toolbar"><button class="btn" id="add">＋ Texto</button><button class="btn" id="del">🗑 Excluir</button><button class="btn" id="bold"><b>B</b></button></div><textarea id="text" class="textedit" placeholder="Selecione um texto adicionado"></textarea><p class="help">Tamanho <input class="field" id="size" type="number" min="6" max="96" value="16"> px</p><p class="help">Arraste os textos para posicioná-los. O PDF original é preservado; os textos adicionados são incorporados ao arquivo baixado.</p></aside></div><script type="module">import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const {PDFDocument,rgb,StandardFonts}=PDFLib;let sourceBytes=null,pdf=null,pageNum=1,scale=1.25,selected=null,items=[];const $=id=>document.getElementById(id);(function(){const k='costalog-theme',r=document.documentElement,b=$('theme');const a=d=>{r.classList.toggle('dark',d);localStorage.setItem(k,d?'dark':'light');b.textContent=d?'☀️':'🌙'};a(localStorage.getItem(k)==='dark');b.onclick=()=>a(!r.classList.contains('dark'))})();function wire(){const d=$('drop'),f=$('file');d.onclick=()=>f.click();d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();if(e.dataTransfer.files[0])openFile(e.dataTransfer.files[0])};f.onchange=e=>{if(e.target.files[0])openFile(e.target.files[0])}}async function openFile(file){if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name))return alert('Escolha um PDF.');sourceBytes=new Uint8Array(await file.arrayBuffer());pdf=await pdfjsLib.getDocument({data:sourceBytes.slice()}).promise;items=[];selected=null;$('empty').style.display='none';$('page').style.display='block';await thumbs();await render(1)}async function thumbs(){const t=$('thumbs');t.innerHTML='';for(let i=1;i<=pdf.numPages;i++){const w=document.createElement('div');w.className='thumb'+(i===1?' active':'');const c=document.createElement('canvas');w.append(c);const s=document.createElement('small');s.textContent='Página '+i;w.append(s);w.onclick=()=>render(i);t.append(w);const p=await pdf.getPage(i),v=p.getViewport({scale:.22});c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise}}async function render(n){pageNum=n;document.querySelectorAll('.thumb').forEach((x,i)=>x.classList.toggle('active',i===n-1));const p=await pdf.getPage(n),v=p.getViewport({scale});const el=$('page');el.innerHTML='';const c=document.createElement('canvas');c.width=v.width;c.height=v.height;el.style.width=v.width+'px';el.style.height=v.height+'px';el.append(c);await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;items.filter(x=>x.page===n).forEach(addOverlay)}function addOverlay(o){const e=document.createElement('div');e.className='overlay'+(selected===o?' selected':'');e.textContent=o.text;e.style.left=o.x+'px';e.style.top=o.y+'px';e.style.fontSize=o.size+'px';e.style.fontWeight=o.bold?'800':'400';e.onclick=x=>{x.stopPropagation();select(o)};e.onpointerdown=x=>drag(x,o,e);$('page').append(e)}function select(o){selected=o;$('text').value=o.text;$('size').value=o.size;render(pageNum)}function drag(e,o,el){e.preventDefault();const sx=e.clientX,sy=e.clientY,ox=o.x,oy=o.y,move=x=>{o.x=Math.max(0,ox+x.clientX-sx);o.y=Math.max(0,oy+x.clientY-sy);el.style.left=o.x+'px';el.style.top=o.y+'px'},up=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up)};addEventListener('pointermove',move);addEventListener('pointerup',up)}$('add').onclick=()=>{if(!pdf)return;const o={page:pageNum,x:45,y:45,text:'Novo texto',size:16,bold:false};items.push(o);selected=o;render(pageNum);$('text').focus();$('text').select()};$('del').onclick=()=>{if(!selected)return;items=items.filter(x=>x!==selected);selected=null;$('text').value='';render(pageNum)};$('text').oninput=e=>{if(selected){selected.text=e.target.value;render(pageNum)}};$('size').oninput=e=>{if(selected){selected.size=Number(e.target.value)||16;render(pageNum)}};$('bold').onclick=()=>{if(selected){selected.bold=!selected.bold;render(pageNum)}};$('save').onclick=async()=>{if(!pdf)return alert('Abra um PDF primeiro.');const out=await PDFDocument.load(sourceBytes),f=await out.embedFont(StandardFonts.Helvetica),fb=await out.embedFont(StandardFonts.HelveticaBold),pw=$('page').clientWidth;for(const o of items){const p=out.getPage(o.page-1),sx=p.getWidth()/pw,sy=p.getHeight()/$('page').clientHeight;String(o.text).split('\n').forEach((line,i)=>p.drawText(line,{x:o.x*sx,y:p.getHeight()-(o.y+i*o.size*1.2)*sy-o.size*sy,size:o.size*sx,font:o.bold?fb:f,color:rgb(0,0,0)}))}const bytes=await out.save(),u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download='COSTALOG-PDF-editado.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};wire();</script></body></html>
